[project]
name = "swiftplay"
version = "0.1.0"
description = "SwiftPlay - Cliente nativo ultraliviano para YouTube y YouTube Music"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",
    "python-mpv>=1.0.7",
    "yt-dlp[default]>=2025.1.1",
    "ytmusicapi>=1.9.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swiftplay"]

[tool.uv]
package = true
